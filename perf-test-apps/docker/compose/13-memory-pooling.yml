# 13-memory-pooling - New buffer per use vs pooling
#
# Generated file. Enable with ENABLE_13_MEMORY_POOLING=true in .env, then:
#     ./run.sh up memory-pooling
#
# Services:
#   13-memory-pooling-py-incorrect
#   13-memory-pooling-py-correct
#   13-memory-pooling-js-incorrect
#   13-memory-pooling-js-correct
#   13-memory-pooling-c-incorrect
#   13-memory-pooling-c-correct

services:
  13-memory-pooling-py-incorrect:
    profiles: ["ENABLE_13_MEMORY_POOLING_PY_INCORRECT"]
    image: perf-demo-python:local
    container_name: 13-memory-pooling-py-incorrect
    command: ["python3", "13-memory-pooling/incorrect.py"]
    environment:
      DURATION_SEC: "${DURATION_SEC:-20}"
    working_dir: /app
    tmpfs:
      - /data:size=512m
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2}"
          memory: ${MEMORY_LIMIT:-1g}
    restart: "no"

  13-memory-pooling-py-correct:
    profiles: ["ENABLE_13_MEMORY_POOLING_PY_CORRECT"]
    image: perf-demo-python:local
    container_name: 13-memory-pooling-py-correct
