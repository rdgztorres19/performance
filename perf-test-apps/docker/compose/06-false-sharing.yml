    container_name: 06-false-sharing-js-incorrect
    command: ["node", "06-false-sharing/incorrect.js"]
    environment:
      DURATION_SEC: "${DURATION_SEC:-20}"
    working_dir: /app
    tmpfs:
      - /data:size=512m
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2}"
          memory: ${MEMORY_LIMIT:-1g}
    restart: "no"

  06-false-sharing-js-correct:
    profiles: ["ENABLE_06_FALSE_SHARING_JS_CORRECT"]
    image: perf-demo-node:local
    container_name: 06-false-sharing-js-correct
    command: ["node", "06-false-sharing/correct.js"]
    environment:
      DURATION_SEC: "${DURATION_SEC:-20}"
    working_dir: /app
    tmpfs:
      - /data:size=512m
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2}"
          memory: ${MEMORY_LIMIT:-1g}
    restart: "no"

  06-false-sharing-c-incorrect:
    profiles: ["ENABLE_06_FALSE_SHARING_C_INCORRECT"]
    image: perf-demo-c:local
    container_name: 06-false-sharing-c-incorrect
    command: ["/app/06-false-sharing/incorrect"]
    environment:
      DURATION_SEC: "${DURATION_SEC:-20}"
    working_dir: /app
    tmpfs:
      - /data:size=512m
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2}"
          memory: ${MEMORY_LIMIT:-1g}
    restart: "no"

  06-false-sharing-c-correct:
    profiles: ["ENABLE_06_FALSE_SHARING_C_CORRECT"]
