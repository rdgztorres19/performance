    environment:
      DURATION_SEC: "${DURATION_SEC:-20}"
    working_dir: /app
    tmpfs:
      - /data:size=512m
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2}"
          memory: ${MEMORY_LIMIT:-1g}
    restart: "no"

  04-memory-allocation-js-correct:
    profiles: ["ENABLE_04_MEMORY_ALLOCATION_JS_CORRECT"]
    image: perf-demo-node:local
    container_name: 04-memory-allocation-js-correct
