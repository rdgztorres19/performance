# 27-zero-copy - Copying buffers vs zero-copy
#
# Generated file. Enable with ENABLE_27_ZERO_COPY=true in .env, then:
#     ./run.sh up zero-copy
#
# Services:
#   27-zero-copy-py-incorrect
#   27-zero-copy-py-correct
#   27-zero-copy-js-incorrect
#   27-zero-copy-js-correct
#   27-zero-copy-c-incorrect
#   27-zero-copy-c-correct

services:
  27-zero-copy-py-incorrect:
    profiles: ["ENABLE_27_ZERO_COPY_PY_INCORRECT"]
    image: perf-demo-python:local
    container_name: 27-zero-copy-py-incorrect
    command: ["python3", "27-zero-copy/incorrect.py"]
    environment:
      DURATION_SEC: "${DURATION_SEC:-20}"
    working_dir: /app
    tmpfs:
      - /data:size=512m
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2}"
          memory: ${MEMORY_LIMIT:-1g}
    restart: "no"

  27-zero-copy-py-correct:
    profiles: ["ENABLE_27_ZERO_COPY_PY_CORRECT"]
    image: perf-demo-python:local
    container_name: 27-zero-copy-py-correct
