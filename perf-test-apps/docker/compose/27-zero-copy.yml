    environment:
      DURATION_SEC: "${DURATION_SEC:-20}"
    working_dir: /app
    tmpfs:
      - /data:size=512m
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2}"
          memory: ${MEMORY_LIMIT:-1g}
    restart: "no"

  27-zero-copy-js-correct:
    profiles: ["ENABLE_27_ZERO_COPY_JS_CORRECT"]
    image: perf-demo-node:local
    container_name: 27-zero-copy-js-correct
