    restart: "no"

  15-memory-access-patterns-c-incorrect:
    profiles: ["ENABLE_15_MEMORY_ACCESS_PATTERNS_C_INCORRECT"]
    image: perf-demo-c:local
    container_name: 15-memory-access-patterns-c-incorrect
    command: ["/app/15-memory-access-patterns/incorrect"]
    environment:
      DURATION_SEC: "${DURATION_SEC:-20}"
