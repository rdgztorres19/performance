    image: perf-demo-node:local
    container_name: 15-memory-access-patterns-js-incorrect
    command: ["node", "15-memory-access-patterns/incorrect.js"]
    environment:
      DURATION_SEC: "${DURATION_SEC:-20}"
    working_dir: /app
    tmpfs:
      - /data:size=512m
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2}"
          memory: ${MEMORY_LIMIT:-1g}
    restart: "no"

  15-memory-access-patterns-js-correct:
    profiles: ["ENABLE_15_MEMORY_ACCESS_PATTERNS_JS_CORRECT"]
    image: perf-demo-node:local
